name: CI/CD Pipeline - Blue-Green Switching

on:
  push:
    branches:
      - feat/cicd-cjh

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Blue-Green Switch Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. 현재 로드밸런서가 어느 그룹을 보는지 확인
      - name: Check current Target Group
        id: check-tg
        run: |
          CURRENT_TG_ARN=$(aws elbv2 describe-listeners --listener-arn ${{ secrets.ALB_LISTENER_ARN }} --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          
          if [ "$CURRENT_TG_ARN" == "${{ secrets.TG_BLUE_ARN }}" ]; then
            echo "TARGET_HOST=${{ secrets.EC2_HOST2 }}" >> $GITHUB_ENV
            echo "TARGET_TG_ARN=${{ secrets.TG_GREEN_ARN }}" >> $GITHUB_ENV
          else
            echo "TARGET_HOST=${{ secrets.EC2_HOST }}" >> $GITHUB_ENV
            echo "TARGET_TG_ARN=${{ secrets.TG_BLUE_ARN }}" >> $GITHUB_ENV
          fi

      # 2. 대기 중인 서버에 배포 (yml 설정 유지 + 런타임 주입)
      - name: Deploy to Target Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.TARGET_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            docker rm -f quicksells-app 2>/dev/null || true
            
            # yml의 localhost를 무시하고 실제 환경변수를 주입하여 실행
            docker run -d \
              --name quicksells-app \
              --network host \
              --restart always \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GOOGLE_EMAIL="${{ secrets.GOOGLE_EMAIL }}" \
              -e GOOGLE_APP_PASSWORD="${{ secrets.GOOGLE_APP_PASSWORD }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e AWS_ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY }}" \
              -e AWS_SECRET_KEY="${{ secrets.AWS_SECRET_KEY }}" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
              -e TOSS_CLIENT_KEY="${{ secrets.TOSS_CLIENT_KEY }}" \
              -e TOSS_SECRET_KEY="${{ secrets.TOSS_SECRET_KEY }}" \
              ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            
            docker image prune -af

      # 3. 새 서버가 뜰 때까지 잠시 대기
      - name: Wait until Target Group is healthy
        run: |
          echo "Waiting for target group to be healthy..."

          for i in {1..30}; do
            STATES=$(aws elbv2 describe-target-health \
              --target-group-arn ${{ env.TARGET_TG_ARN }} \
              --query "TargetHealthDescriptions[].TargetHealth.State" \
              --output text)

            echo "Current states: $STATES"

            if echo "$STATES" | grep -q healthy; then
              echo "Target group is healthy!"
              exit 0
            fi

            sleep 10
          done

          echo "Health check failed"
          exit 1

      # 4. 리스너 스위칭 (블루 <-> 그린 교체)
      - name: Switch Target Group
        run: |
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions Type=forward,TargetGroupArn=${{ env.TARGET_TG_ARN }}