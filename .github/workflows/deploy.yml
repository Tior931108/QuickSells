name: CI/CD Pipeline

on:
  push:
    branches:
      - feat/cicd-cjh

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 💡 [핵심 수정] envs 형식을 한 줄로 명확하게 선언
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET_KEY,AWS_ACCESS_KEY,AWS_SECRET_KEY,AWS_S3_BUCKET
          script: |
            # 1. ECR 로그인
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 2. 기존 컨테이너 중지 및 삭제
            docker stop cicd-test 2>/dev/null || true
            docker rm cicd-test 2>/dev/null || true

            # 3. 최신 이미지 Pull
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 4. 환경 변수와 함께 컨테이너 실행
            # 💡 [핵심 수정] 변수 누락 방지를 위해 ${} 형식을 사용하고 따옴표로 감쌈
            docker run -d \
              --name cicd-test \
              -p 8080:8080 \
              -e DB_URL="${DB_URL}" \
              -e DB_USERNAME="${DB_USERNAME}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
              -e AWS_ACCESS_KEY="${AWS_ACCESS_KEY}" \
              -e AWS_SECRET_KEY="${AWS_SECRET_KEY}" \
              -e AWS_S3_BUCKET="${AWS_S3_BUCKET}" \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 5. 미사용 이미지 삭제
            docker image prune -f